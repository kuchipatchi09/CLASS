<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>챌린저컵 초기 설정</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #f5f7fa;
      color: #17202a;
      font-family:
        Pretendard,
        "Apple SD Gothic Neo",
        "Noto Sans KR",
        Arial,
        sans-serif;
    }

    .box {
      max-width: 650px;
      margin: 70px auto;
      padding: 35px;
      background: #ffffff;
      border: 1px solid #e3e7ec;
      border-radius: 20px;
      box-shadow: 0 10px 35px rgba(20, 30, 45, 0.07);
    }

    h1 {
      margin: 0 0 15px;
      font-size: 28px;
    }

    .note {
      margin-bottom: 25px;
      color: #6f7882;
      font-size: 13px;
      line-height: 1.7;
    }

    button {
      width: 100%;
      padding: 16px;
      margin-top: 12px;
      border: 0;
      border-radius: 12px;
      background: #1468ff;
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover:not(:disabled) {
      background: #0759df;
    }

    button:disabled {
      background: #aeb5be;
      cursor: not-allowed;
    }

    #status {
      min-height: 70px;
      margin-top: 18px;
      padding: 15px;
      background: #f2f4f7;
      border-radius: 12px;
      color: #46505b;
      font-size: 13px;
      line-height: 1.6;
      white-space: pre-wrap;
    }

    @media (max-width: 700px) {
      .box {
        margin: 25px 15px;
        padding: 25px 20px;
      }
    }
  </style>
</head>

<body>
  <main class="box">
    <h1>제5회 챌린저컵 초기 설정</h1>

    <p class="note">
      관리자 계정으로 로그인한 뒤 11경기를 한 번에 생성합니다.
      기존 match01 문서도 정확한 정보로 덮어씁니다.
      데이터 생성이 끝나면 보안을 위해 GitHub에서 setup.html을
      삭제하세요.
    </p>

    <button id="loginButton">
      관리자 Google 계정으로 로그인
    </button>

    <button id="seedButton" disabled>
      11경기 데이터 생성
    </button>

    <div id="status">
      관리자 로그인이 필요합니다.
    </div>
  </main>

  <script type="module">
    import {
      initializeApp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

    import {
      getAuth,
      GoogleAuthProvider,
      signInWithPopup,
      signOut
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      writeBatch,
      Timestamp
    } from
      "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    /*
     * Firebase 프로젝트 연결 설정
     */
    const firebaseConfig = {
      apiKey:
        "AIzaSyBY2VslIG_hNSxm2_ImUwvHGK8W7B704Q8",

      authDomain:
        "challengercup-63049.firebaseapp.com",

      projectId:
        "challengercup-63049",

      storageBucket:
        "challengercup-63049.firebasestorage.app",

      messagingSenderId:
        "703139081412",

      appId:
        "1:703139081412:web:7ecc96136ea37cc91e2d91",

      measurementId:
        "G-YE8JWZRMXC"
    };

    /*
     * 관리자 학교 계정
     */
    const ADMIN_EMAIL =
      "cnsh32_1218@g.cnees.kr";

    /*
     * Firebase 초기화
     */
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const provider = new GoogleAuthProvider();

    provider.setCustomParameters({
      hd: "g.cnees.kr",
      prompt: "select_account"
    });

    const loginButton =
      document.getElementById("loginButton");

    const seedButton =
      document.getElementById("seedButton");

    const statusBox =
      document.getElementById("status");

    /*
     * 전체 경기 정보
     *
     * 형식:
     * [
     *   문서 ID,
     *   라운드,
     *   A팀,
     *   B팀,
     *   마감 시각,
     *   경기 시간대,
     *   부전승 팀
     * ]
     */
    const matches = [
      [
        "match01",
        "1라운드",
        "3-1",
        "1-2",
        "2026-08-20T12:50:00+09:00",
        "점심",
        null
      ],
      [
        "match02",
        "1라운드",
        "3-4",
        "1-1",
        "2026-08-20T18:20:00+09:00",
        "저녁",
        null
      ],
      [
        "match03",
        "1라운드",
        "1-4",
        "2-4",
        "2026-08-24T12:50:00+09:00",
        "점심",
        null
      ],
      [
        "match04",
        "1라운드",
        "3-3",
        "3-2",
        "2026-08-24T18:20:00+09:00",
        "저녁",
        null
      ],
      [
        "match05",
        "8강",
        "1-3",
        "W1",
        "2026-08-25T12:50:00+09:00",
        "점심",
        "1-3"
      ],
      [
        "match06",
        "8강",
        "W2",
        "2-2",
        "2026-08-25T18:20:00+09:00",
        "저녁",
        "2-2"
      ],
      [
        "match07",
        "8강",
        "2-1",
        "W3",
        "2026-08-26T18:20:00+09:00",
        "저녁",
        "2-1"
      ],
      [
        "match08",
        "8강",
        "W4",
        "2-3",
        "2026-08-27T12:50:00+09:00",
        "점심",
        "2-3"
      ],
      [
        "match09",
        "준결승",
        "W5",
        "W6",
        "2026-08-27T18:20:00+09:00",
        "저녁",
        null
      ],
      [
        "match10",
        "준결승",
        "W7",
        "W8",
        "2026-08-31T12:50:00+09:00",
        "점심",
        null
      ],
      [
        "match11",
        "결승",
        "W9",
        "W10",
        "2026-09-01T12:50:00+09:00",
        "점심",
        null
      ]
    ];

    /*
     * 관리자 로그인
     */
    loginButton.addEventListener(
      "click",
      async () => {
        loginButton.disabled = true;
        statusBox.textContent =
          "Google 로그인 창을 여는 중입니다.";

        try {
          const result =
            await signInWithPopup(auth, provider);

          const email =
            result.user.email
              ?.toLowerCase()
              .trim();

          if (email !== ADMIN_EMAIL) {
            await signOut(auth);

            throw new Error(
              "지정된 관리자 계정이 아닙니다. " +
              ADMIN_EMAIL +
              " 계정으로 로그인하세요."
            );
          }

          seedButton.disabled = false;

          loginButton.textContent =
            "관리자 로그인 완료";

          statusBox.textContent =
            "관리자 로그인 완료\n" +
            email +
            "\n\n이제 11경기 데이터 생성 버튼을 누르세요.";
        } catch (error) {
          console.error(error);

          loginButton.disabled = false;

          statusBox.textContent =
            "로그인 실패\n" +
            (error.message ?? error);
        }
      }
    );

    /*
     * 11개 경기 문서 일괄 생성
     */
    seedButton.addEventListener(
      "click",
      async () => {
        const currentEmail =
          auth.currentUser
            ?.email
            ?.toLowerCase()
            .trim();

        if (currentEmail !== ADMIN_EMAIL) {
          statusBox.textContent =
            "관리자 인증이 확인되지 않았습니다.";

          return;
        }

        const confirmed = window.confirm(
          "matches 컬렉션에 match01부터 " +
          "match11까지 생성합니다.\n\n" +
          "기존 match01은 새 정보로 덮어씁니다.\n" +
          "진행할까요?"
        );

        if (!confirmed) {
          return;
        }

        seedButton.disabled = true;

        statusBox.textContent =
          "11경기 데이터를 생성하는 중입니다.";

        try {
          const batch = writeBatch(db);

          matches.forEach(
            (
              [
                id,
                round,
                teamA,
                teamB,
                deadlineString,
                session,
                byeTeam
              ],
              index
            ) => {
              const deadlineDate =
                new Date(deadlineString);

              const matchReference =
                doc(db, "matches", id);

              const dateText =
                new Intl.DateTimeFormat(
                  "ko-KR",
                  {
                    timeZone: "Asia/Seoul",
                    month: "long",
                    day: "numeric",
                    weekday: "long"
                  }
                ).format(deadlineDate);

              batch.set(
                matchReference,
                {
                  matchNo: index + 1,
                  round: round,
                  teamA: teamA,
                  teamB: teamB,

                  deadline:
                    Timestamp.fromDate(
                      deadlineDate
                    ),

                  dateLabel:
                    `${dateText} ${session}`,

                  session:
                    session === "점심"
                      ? "lunch"
                      : "dinner",

                  /*
                   * 첫 경기만 바로 예측 가능
                   * 나머지는 운영자가 순서대로 개방
                   */
                  status:
                    index === 0
                      ? "open"
                      : "scheduled",

                  winner: null,
                  byeTeam: byeTeam
                },
                {
                  merge: false
                }
              );
            }
          );

          await batch.commit();

          statusBox.textContent =
            "경기 데이터 생성 성공\n\n" +
            "match01부터 match11까지 모두 생성했습니다.\n" +
            "Firestore의 matches 컬렉션을 확인하세요.\n\n" +
            "확인 후 GitHub 저장소에서 setup.html을 " +
            "삭제하세요.";

          seedButton.textContent =
            "경기 데이터 생성 완료";
        } catch (error) {
          console.error(error);

          seedButton.disabled = false;

          statusBox.textContent =
            "데이터 생성 실패\n" +
            (error.message ?? error) +
            "\n\nFirestore 규칙에 관리자 쓰기 권한이 " +
            "설정되어 있는지 확인하세요.";
        }
      }
    );
  </script>
</body>
</html>
